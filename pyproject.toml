[project]
name = "rag-generator"
version = "0.1.0"
description = "Runtime-document RAG with grounded, cited answers"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pypdf",
    "fastembed",
    "anthropic",
    "fastapi",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "httpx"]

[tool.setuptools]
packages = ["rag"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
