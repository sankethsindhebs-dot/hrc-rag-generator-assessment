<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Generator</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1b1b1f; --card:#fff; --line:#d8d8de; --accent:#2f5bea; --ok:#1a7f37; --warn:#b35900; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --fg:#ececf1; --card:#1c1c20; --line:#33333a; --accent:#7c9bff; --ok:#4cc26a; --warn:#f0a050; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 4px; } p.sub { margin:0 0 20px; opacity:.7; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text] { width:100%; box-sizing:border-box; padding:8px; font:inherit; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:8px; } .row input { flex:1; }
  .status { margin-top:10px; min-height:1.4em; } .error { color:var(--warn); }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.85rem; border:1px solid currentColor; }
  .badge.ok { color:var(--ok); } .badge.no { color:var(--warn); }
  #answer { white-space:pre-wrap; margin:10px 0; }
  .source { border-left:3px solid var(--accent); padding:4px 10px; margin:10px 0; }
  .source .meta { font-size:.85rem; opacity:.75; } .source .snip { font-size:.9rem; white-space:pre-wrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>RAG Generator</h1>
  <p class="sub">Upload PDF or TXT files, then ask questions. Answers come only from your documents, with sources.</p>

  <section>
    <h2>1. Upload documents</h2>
    <input id="files" type="file" accept=".pdf,.txt" multiple>
    <p><button id="upload">Build index</button></p>
    <div id="uploadStatus" class="status" role="status"></div>
  </section>

  <section id="askSection" hidden>
    <h2>2. Ask a question</h2>
    <form id="askForm" class="row">
      <input id="question" type="text" maxlength="1000" placeholder="Ask something about your documents" required>
      <button id="ask" type="submit">Ask</button>
    </form>
    <div id="askStatus" class="status" role="status"></div>
    <div id="result" hidden>
      <span id="badge" class="badge"></span>
      <div id="answer"></div>
      <div id="sources"></div>
    </div>
  </section>
</main>
<script>
  // All server-provided text goes in via textContent (documents and answers are untrusted).
  const $ = id => document.getElementById(id);
  let collectionId = null;

  async function call(url, options) {
    const res = await fetch(url, options);
    let body = null;
    try { body = await res.json(); } catch (e) { /* non-JSON error body */ }
    if (!res.ok) throw new Error(typeof body?.detail === "string" ? body.detail : `Request failed (${res.status})`);
    return body;
  }

  $("upload").addEventListener("click", async () => {
    const files = $("files").files;
    const status = $("uploadStatus");
    status.className = "status";
    if (!files.length) { status.textContent = "Choose at least one PDF or TXT file."; status.classList.add("error"); return; }
    const form = new FormData();
    for (const f of files) form.append("files", f);
    $("upload").disabled = true; status.textContent = "Reading and indexing…";
    try {
      const out = await call("/collections", { method: "POST", body: form });
      collectionId = out.collection_id;
      status.textContent = `Indexed ${out.documents.join(", ")} (${out.n_chunks} chunks).`;
      $("askSection").hidden = false; $("result").hidden = true;
    } catch (e) {
      collectionId = null; $("askSection").hidden = true;
      status.textContent = e.message; status.classList.add("error");
    } finally { $("upload").disabled = false; }
  });

  $("askForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const status = $("askStatus");
    status.className = "status"; status.textContent = "Thinking…"; $("ask").disabled = true;
    try {
      const out = await call(`/collections/${collectionId}/ask`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: $("question").value }),
      });
      status.textContent = "";
      const badge = $("badge");
      badge.textContent = out.sufficient ? "Grounded answer" : "Insufficient context";
      badge.className = "badge " + (out.sufficient ? "ok" : "no");
      $("answer").textContent = out.answer;
      const box = $("sources"); box.replaceChildren();
      for (const s of out.sources) {
        const div = document.createElement("div"); div.className = "source";
        const meta = document.createElement("div"); meta.className = "meta";
        meta.textContent = `[${s.label}] ${s.doc}, page ${s.page} (similarity ${s.score})`;
        const snip = document.createElement("div"); snip.className = "snip"; snip.textContent = s.snippet;
        div.append(meta, snip); box.append(div);
      }
      $("result").hidden = false;
    } catch (e) {
      $("result").hidden = true; status.textContent = e.message; status.classList.add("error");
    } finally { $("ask").disabled = false; }
  });
</script>
</body>
</html>
